name: Heritage data validation
on:
  push:
    branches: [main, feat/heritage-guide-upgrade]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate directory and editorial data
        run: python tools/validate_heritage_data.py
      - name: Compile Python source
        run: python -m compileall -q server tools
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check heritage-additions.js
          node --check heritage-enhancements.js
          node --check seo-content.js
